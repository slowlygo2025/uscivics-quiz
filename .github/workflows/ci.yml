name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · i18n · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: i18n integrity
        run: npm run check:i18n

      - name: Firestore rules sanity
        run: npm run check:firestore-rules

      - name: Production build
        run: npm run build
        env:
          # Avoid Sentry release upload warning in CI (no org secrets required)
          SENTRY_AUTH_TOKEN: ""
          CI: true

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke + a11y e2e
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
